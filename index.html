
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Skins</title>

    <link href="https://fonts.cdnfonts.com/css/minecraft-4" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f0f0f0;
            color: #333;
            font-family: 'Minecraft', sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        .header-container {
            background-color: lightblue;
            padding: 30px;
            position: relative;
            transition: background-color 0.3s;
        }

        .mc {
            font-family: 'Minecraft', sans-serif;
            font-size: 45px;
            background-color: lightblue;
            padding: 20px 60px;
            text-align: center;
            transition: background-color 0.3s, color 0.3s;
        }

        /* Mond-/Sonnen-Button */
        .theme-toggle {
            position: absolute;
            top: 50%;
            right: 25px;
            transform: translateY(-50%);
            width: 50px;
            height: 50px;
            border: 2px solid rgba(0, 0, 0, 0.1);
            border-radius: 50%;
            background-color: #ffffff;
            color: #333;
            font-size: 28px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.3s, transform 0.3s;
            z-index: 10;
        }

        .theme-toggle:hover {
            transform: translateY(-50%) scale(1.1);
        }

        /* Skin-Karten */
        .skins-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .skin-card {
            background-color: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
            transition: background-color 0.3s, color 0.3s;
        }

        .skin-image {
            width: 100%;
            height: 300px;
            display: block;
            background-color: #ddd;
        }

        .skin-card-content {
            padding: 20px;
        }

        .skin-card h3 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #333;
            transition: color 0.3s;
        }

        .skin-card p {
            color: #666;
            font-size: 16px;
        }

        .rank {
            display: inline-block;
            background-color: #ffd700;
            color: #333;
            padding: 5px 10px;
            border-radius: 5px;
            margin-top: 10px;
            font-weight: bold;
        }

        .download-btn {
            display: inline-block;
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            margin-top: 15px;
            text-decoration: none;
            cursor: pointer;
            border: none;
            font-family: 'Minecraft', sans-serif;
            font-size: 16px;
            transition: background-color 0.3s;
        }

        .download-btn:hover {
            background-color: #45a049;
        }

        /* Dunkelmodus */
        body.dark-mode {
            background-color: #181818;
            color: #f5f5f5;
        }

        body.dark-mode .header-container,
        body.dark-mode .mc {
            background-color: #263238;
            color: #ffffff;
        }

        body.dark-mode .skin-card {
            background-color: #292929;
            color: #ffffff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
        }

        body.dark-mode .skin-card h3 {
            color: #ffffff;
        }

        body.dark-mode .skin-card p {
            color: #cccccc;
        }

        body.dark-mode .skin-image {
            background-color: #383838;
        }

        body.dark-mode .theme-toggle {
            background-color: #333333;
            color: #ffffff;
            border-color: #555555;
        }

        /* Mobile Ansicht */
        @media (max-width: 600px) {
            .header-container {
                padding: 20px 10px;
            }

            .mc {
                font-size: 25px;
                padding: 20px 45px 20px 10px;
            }

            .theme-toggle {
                right: 10px;
                width: 40px;
                height: 40px;
                font-size: 23px;
            }

            .skins-container {
                grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
                padding: 15px;
                gap: 15px;
            }
        }
    </style>
</head>

<body>

    <!-- Kopfbereich -->
    <div class="header-container">
        <h1 class="mc">Minecraft Skins</h1>

        <button
            id="themeToggle"
            class="theme-toggle"
            onclick="toggleTheme()"
            aria-label="Dunkelmodus aktivieren"
            title="Hell-/Dunkelmodus wechseln">
            🌙
        </button>
    </div>

    <!-- Skin-Galerie -->
    <div class="skins-container">

        <div class="skin-card">
            <canvas id="skin1" class="skin-image"></canvas>
            <div class="skin-card-content">
                <h3>#1</h3>
                <div class="rank">🥇 #1</div>
                <br>
                <a href="skin1.png" download="skin1.png" class="download-btn">
                    ⬇️ Download
                </a>
            </div>
        </div>

        <div class="skin-card">
            <canvas id="skin2" class="skin-image"></canvas>
            <div class="skin-card-content">
                <h3>#2</h3>
                <div class="rank">🥈 #2</div>
                <br>
                <a href="skin2.png" download="skin2.png" class="download-btn">
                    ⬇️ Download
                </a>
            </div>
        </div>

        <div class="skin-card">
            <canvas id="skin3" class="skin-image"></canvas>
            <div class="skin-card-content">
                <h3>#3</h3>
                <div class="rank">🥉 #3</div>
                <br>
                <a href="skin3.png" download="skin3.png" class="download-btn">
                    ⬇️ Download
                </a>
            </div>
        </div>

        <div class="skin-card">
            <canvas id="skin4" class="skin-image"></canvas>
            <div class="skin-card-content">
                <h3>#4</h3>
                <div class="rank">⭐ #4</div>
                <br>
                <a href="skin4.png" download="skin4.png" class="download-btn">
                    ⬇️ Download
                </a>
            </div>
        </div>

        <div class="skin-card">
            <canvas id="skin5" class="skin-image"></canvas>
            <div class="skin-card-content">
                <h3>#5</h3>
                <div class="rank">⭐ #5</div>
                <br>
                <a href="skin5.png" download="skin5.png" class="download-btn">
                    ⬇️ Download
                </a>
            </div>
        </div>

        <div class="skin-card">
            <canvas id="skin6" class="skin-image"></canvas>
            <div class="skin-card-content">
                <h3>#6</h3>
                <div class="rank">⭐ #6</div>
                <br>
                <a href="skin6.png" download="skin6.png" class="download-btn">
                    ⬇️ Download
                </a>
            </div>
        </div>

    </div>

    <!-- Skin-Viewer-Bibliothek -->
    <script src="https://unpkg.com/skinview3d@3.4.1/bundles/skinview3d.bundle.js"></script>

    <script>
        // Hell- und Dunkelmodus umschalten
        function toggleTheme() {
            const body = document.body;
            const button = document.getElementById("themeToggle");

            body.classList.toggle("dark-mode");

            const isDark = body.classList.contains("dark-mode");

            button.textContent = isDark ? "☀️" : "🌙";

            button.setAttribute(
                "aria-label",
                isDark
                    ? "Hellmodus aktivieren"
                    : "Dunkelmodus aktivieren"
            );

            button.title = isDark
                ? "Zum Hellmodus wechseln"
                : "Zum Dunkelmodus wechseln";
        }

        // Minecraft-Skin erstellen
        function createSkin(canvasId, skinPath) {
            const canvas = document.getElementById(canvasId);

            const viewer = new skinview3d.SkinViewer({
                canvas: canvas,
                width: 250,
                height: 300,
                skin: skinPath
            });

            viewer.autoRotate = true;
            viewer.autoRotateSpeed = 0.5;

            viewer.camera.position.set(0, 0, 60);
        }

        // Alle sechs Skins laden
        createSkin("skin1", "skin1.png");
        createSkin("skin2", "skin2.png");
        createSkin("skin3", "skin3.png");
        createSkin("skin4", "skin4.png");
        createSkin("skin5", "skin5.png");
        createSkin("skin6", "skin6.png");
    </script>

</body>
</html>
